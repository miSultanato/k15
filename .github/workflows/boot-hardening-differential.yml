name: k15 boot hardening source differential

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - audit/check_boot_hardening.py
      - audit/check_boot_binary.py
      - audit/test_e820_signature.py
      - .github/workflows/boot-hardening-differential.yml

permissions:
  contents: read

concurrency:
  group: k15-boot-hardening-source-v2
  cancel-in-progress: false

jobs:
  source:
    name: Boot/build hardening — frozen vs upstream
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out audit harness
        uses: actions/checkout@v4

      - name: Check out frozen bounty source
        uses: actions/checkout@v4
        with:
          repository: FileSherlock/k15
          ref: ab93479ebc7c85274c722b16897148286d1cfca3
          path: bounty
          persist-credentials: false

      - name: Check out first upstream fix
        uses: actions/checkout@v4
        with:
          repository: FileSherlock/k15
          ref: a2d8893261b2be15b44c86d6f4483d65820e943a
          path: fixed
          persist-credentials: false

      - name: Check out current upstream main snapshot
        uses: actions/checkout@v4
        with:
          repository: FileSherlock/k15
          ref: cb9f76a5a100c418bfcaeddcd4f137d30ab489d2
          path: current
          persist-credentials: false

      - name: Verify all source pins
        run: |
          test "$(git -C bounty rev-parse HEAD)" = "ab93479ebc7c85274c722b16897148286d1cfca3"
          test "$(git -C fixed rev-parse HEAD)" = "a2d8893261b2be15b44c86d6f4483d65820e943a"
          test "$(git -C current rev-parse HEAD)" = "cb9f76a5a100c418bfcaeddcd4f137d30ab489d2"

      - name: Compare four source-level hardening deltas
        run: python3 audit/check_boot_hardening.py bounty fixed current

      - name: Exercise NAME equal to the runner hostname through Make
        run: |
          host=$(hostname)
          for directory in bounty fixed current; do
            (cd "$directory" && NAME="$host" make -B B=build-name-check build-name-check/names.conf)
          done
          python3 - "$(hostname)" <<'PY'
          from pathlib import Path
          import sys
          host = sys.argv[1]
          bounty = Path("bounty/build-name-check/names.conf").read_text().split()
          fixed = Path("fixed/build-name-check/names.conf").read_text().split()
          current = Path("current/build-name-check/names.conf").read_text().split()
          if not bounty or bounty[0] != host:
              raise SystemExit(f"FAIL: frozen Makefile did not preserve NAME={host!r}: {bounty!r}")
          if fixed or current:
              raise SystemExit(f"FAIL: upstream Makefile did not clear hostname NAME: fixed={fixed!r}, current={current!r}")
          print(f"PASS: frozen Makefile writes runner hostname {host!r} into names.conf")
          print("PASS: both upstream Makefiles clear the accidental hostname before certificate generation")
          PY

      - name: Install NASM and isolated 16-bit emulator
        run: |
          sudo apt-get install --yes --no-install-recommends nasm
          python3 -m pip install --disable-pip-version-check cryptography unicorn==2.1.3

      - name: Emulate valid and malformed BIOS E820 responses
        run: |
          python3 audit/test_e820_signature.py bounty frozen
          python3 audit/test_e820_signature.py fixed fixed
          python3 audit/test_e820_signature.py current fixed

      - name: Build with NAME set to the runner hostname
        run: |
          host=$(hostname)
          for directory in bounty fixed current; do
            (cd "$directory" && NAME="$host" make all)
          done
          echo "Synthetic certificate build input: NAME=$host"

      - name: Assert generated certificate SANs honor the Makefile guard
        run: |
          host=$(hostname)
          openssl x509 -in bounty/cert/server.pem -noout -ext subjectAltName | grep -F "DNS:$host"
          for directory in fixed current; do
            if openssl x509 -in "$directory/cert/server.pem" -noout -ext subjectAltName | grep -F "DNS:$host"; then
              echo "FAIL: $directory certificate retained the runner hostname" >&2
              exit 1
            fi
          done
          echo "PASS: frozen certificate includes the accidental hostname; upstream certificates do not"

      - name: Assert emitted-image AP counter alignment and GDT bytes
        run: |
          python3 audit/check_boot_binary.py bounty frozen
          python3 audit/check_boot_binary.py fixed fixed
          python3 audit/check_boot_binary.py current fixed

      - name: Keep generated images and synthetic keys ephemeral
        run: |
          echo "Images, generated certificates and key material remain in the ephemeral runner."
          echo "No artifacts are uploaded and no image is booted in this check."
