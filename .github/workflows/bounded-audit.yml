name: k15 bounded audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - audit/nonce_cycle_demo.py
      - audit/check_rand_path.py
      - audit/check_key_read_path.py
      - audit/test_ecdsa_nonce_boundaries.py
      - audit/run_ct.sh
      - audit/test_clienthello_framing.py
      - audit/qemu_nonce_uniqueness.py
      - audit/run_qemu_nonce.sh
      - audit/run_qemu_framing.sh
      - audit/check_public_proof.py
      - audit/rdrand_host_probe.c
      - .github/workflows/bounded-audit.yml

permissions:
  contents: read

concurrency:
  group: k15-bounded-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Synthetic nonce test and bounty-branch crypto tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out audit harness from the selected workflow branch
        uses: actions/checkout@v4

      - name: Check out the frozen bounty commit
        uses: actions/checkout@v4
        with:
          repository: miSultanato/k15
          ref: ab93479ebc7c85274c722b16897148286d1cfca3
          path: target
          persist-credentials: false

      - name: Probe native RDRAND exposed by the runner CPU
        run: |
          gcc -O2 -Wall -Wextra -mrdrnd audit/rdrand_host_probe.c -o "$RUNNER_TEMP/rdrand-host-probe"
          "$RUNNER_TEMP/rdrand-host-probe" 10000000

      - name: Record tested source revision
        run: |
          echo "Audit harness commit: $GITHUB_SHA"
          echo "Target commit: $(git -C target rev-parse HEAD)"
          test "$(git -C target rev-parse HEAD)" = "ab93479ebc7c85274c722b16897148286d1cfca3"

      - name: Run synthetic RDRAND-cycle and ECDSA recovery demonstration
        run: python3 audit/nonce_cycle_demo.py

      - name: Check RNG call-site and nonce-pool invariants in frozen source
        run: python3 audit/check_rand_path.py target/src/os.asm

      - name: Verify public cross-curve proof offline
        run: python3 audit/check_public_proof.py target/tools target/bounty.proof

      - name: Install minimal native build dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm valgrind qemu-system-x86

      - name: Install Python test dependency
        run: python3 -m pip install --disable-pip-version-check cryptography

      - name: Run upstream assembly crypto tests on the frozen commit
        working-directory: target
        run: make test

      - name: Test deterministic P-256 nonce boundaries against the frozen assembly signer
        run: python3 audit/test_ecdsa_nonce_boundaries.py target

      - name: Audit private-scalar read path and generated curve include
        run: python3 audit/check_key_read_path.py target/src/os.asm target/tools/ec.py target/tools/gen.py target/build/ec.inc

      - name: Reproduce Valgrind constant-time check and six negative controls
        run: bash audit/run_ct.sh target

      - name: Build complete bootable image from frozen source
        working-directory: target
        run: make all

      - name: Measure 10,240 synthetic ECDSA nonces on one QEMU boot
        run: bash audit/run_qemu_nonce.sh target 10240 "$RUNNER_TEMP/k15-nonces-a.txt"

      - name: Compare 1,024 synthetic ECDSA nonces across a second QEMU boot
        run: |
          bash audit/run_qemu_nonce.sh target 1024 "$RUNNER_TEMP/k15-nonces-b.txt"
          python3 - "$RUNNER_TEMP/k15-nonces-a.txt" "$RUNNER_TEMP/k15-nonces-b.txt" <<'PY'
          import sys
          a = set(open(sys.argv[1], encoding="ascii").read().splitlines())
          b = set(open(sys.argv[2], encoding="ascii").read().splitlines())
          overlap = a & b
          print(f"Cross-boot nonce fingerprint overlap: {len(overlap)}")
          if overlap:
              raise SystemExit("FAIL: an ECDSA nonce fingerprint repeated across boots")
          print(f"PASS: {len(a)} + {len(b)} sampled nonce fingerprints have no cross-boot overlap")
          PY

      - name: Boot frozen image in QEMU TCG and reproduce ClientHello framing quirk
        run: bash audit/run_qemu_framing.sh target

      - name: Report generated secret-bearing files are not uploaded
        run: |
          echo "No build/, cert/, private key, or generated image is uploaded as an artifact."
          echo "Runner workspace is ephemeral and is discarded after this job."
