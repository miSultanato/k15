name: k15 IPv4 and ARP protocol boundaries
# Run deterministic local TAP probes, including TLS ACK-desynchronization, against pinned bounty and upstream images.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - audit/test_ip_arp_validation.py
      - audit/test_arp_short_frame.py
      - audit/test_tcp_ack_mss.py
      - audit/test_tcp_rst_sequence.py
      - audit/run_tap_ip_arp.sh
      - audit/run_tap_arp_smp.sh
      - audit/test_tls_tcp_ack_desync.py
      - audit/run_tap_tls_ack_desync.sh
      - audit/run_tap_tcp_wrap.sh
      - .github/workflows/ip-arp-boundaries.yml

permissions:
  contents: read

concurrency:
  group: k15-ip-arp-boundaries-v3
  cancel-in-progress: false

jobs:
  protocol:
    name: IPv4 checksum and ARP field checks — ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: frozen-bounty
            directory: bounty
            ref: ab93479ebc7c85274c722b16897148286d1cfca3
            mode: expect
          - variant: upstream-fixed
            directory: fixed
            ref: a2d8893261b2be15b44c86d6f4483d65820e943a
            mode: observe
          - variant: upstream-current
            directory: current
            ref: cb9f76a5a100c418bfcaeddcd4f137d30ab489d2
            mode: observe
    steps:
      - name: Check out audit harness
        uses: actions/checkout@v4

      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          repository: FileSherlock/k15
          ref: ${{ matrix.ref }}
          path: ${{ matrix.directory }}
          persist-credentials: false

      - name: Verify pinned source
        working-directory: ${{ matrix.directory }}
        run: test "$(git rev-parse HEAD)" = "${{ matrix.ref }}"

      - name: Install QEMU and TAP dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm qemu-system-x86 iproute2 gcc libssl-dev curl
          python3 -m pip install --disable-pip-version-check cryptography

      - name: Build local image with synthetic certificate
        working-directory: ${{ matrix.directory }}
        run: make all

      - name: Run deterministic IPv4 and ARP probes over TAP
        run: sudo unshare -n bash audit/run_tap_ip_arp.sh ${{ matrix.directory }} ${{ matrix.mode }}

      - name: Probe TLS record desynchronization from invalid TCP ACK
        run: sudo unshare -n bash audit/run_tap_tls_ack_desync.sh ${{ matrix.directory }} ${{ matrix.mode }}

      - name: Run short-ARP stale-buffer probe with two processors
        run: sudo unshare -n env SMP=2 bash audit/run_tap_arp_smp.sh ${{ matrix.directory }} ${{ matrix.mode }}

      - name: Build a forced-wrap TCP sequence image
        working-directory: ${{ matrix.directory }}
        run: make B=build-wrap ISNTOP=0xFFFFFFC0 ISNBITS=26 all

      - name: Probe ACK-window boundaries across 2^32
        run: sudo unshare -n bash audit/run_tap_tcp_wrap.sh ${{ matrix.directory }} ${{ matrix.mode }}

      - name: Confirm no generated key material or images are uploaded
        run: |
          echo "Synthetic certificates and images remain in the ephemeral runner."
          echo "No artifacts are uploaded."
