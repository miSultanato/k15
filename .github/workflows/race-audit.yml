name: k15 cross-processor slot race audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/race-audit.yml

permissions:
  contents: read

jobs:
  race:
    concurrency:
      group: k15-race-audit-${{ matrix.race }}
      cancel-in-progress: false
    name: Frozen bounty slot race RACE=${{ matrix.race }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        race: ["1", "2", "3"]
    steps:
      - name: Check out the audit harness
        uses: actions/checkout@v4

      - name: Check out the exact frozen bounty source
        uses: actions/checkout@v4
        with:
          repository: FileSherlock/k15
          ref: ab93479ebc7c85274c722b16897148286d1cfca3
          path: target
          persist-credentials: false

      - name: Record source revision
        run: |
          git -C target rev-parse HEAD
          test "$(git -C target rev-parse HEAD)" = "ab93479ebc7c85274c722b16897148286d1cfca3"

      - name: Install local VM and network-namespace dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm qemu-system-x86 iproute2 gcc libssl-dev curl
          python3 -m pip install --disable-pip-version-check cryptography

      - name: Check privileged network namespace support
        run: sudo unshare -n true

      - name: Adapt the project's rootless unshare call to the runner namespace
        run: |
          mkdir -p "$RUNNER_TEMP/k15-bin"
          cat > "$RUNNER_TEMP/k15-bin/unshare" <<'SH'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "-Urn" ]]; then
            shift
            exec "$@"
          fi
          exec /usr/bin/unshare "$@"
          SH
          chmod +x "$RUNNER_TEMP/k15-bin/unshare"
          echo "$RUNNER_TEMP/k15-bin" >> "$GITHUB_PATH"

      - name: Reproduce cross-processor slot handover race
        working-directory: target
        run: sudo env SMP=2 PATH="$PATH" unshare -n bash tools/racetest.sh "${{ matrix.race }}"
